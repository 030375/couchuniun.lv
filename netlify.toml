# Isolated Netlify preview only for branch couchunion-2.0.
# Production coachunion.lv uses its own branch and configuration.
[build]
  command = "node scripts/build-couchunion-preview.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
