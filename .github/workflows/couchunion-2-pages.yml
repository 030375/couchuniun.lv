name: Couchunion 2.0 — GitHub Pages preview

on:
  push:
    branches: [couchunion-2.0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: couchunion-2-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          touch .nojekyll
          mkdir -p _pages_preview
          cp index.html _pages_preview/
          cp -r favikon img _pages_preview/
          cp coachprogram-detailed-icu.pdf coachprogram.pdf _pages_preview/
          cp otziw.html _pages_preview/
          find _pages_preview -name '*.zip' -delete
          touch _pages_preview/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
