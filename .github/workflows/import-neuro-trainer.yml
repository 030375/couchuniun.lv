name: Import ICU neurocoaching trainer portrait
on:
  push:
    branches:
      - improve/enrollment-experience-nov-2026
    paths:
      - .github/workflows/import-neuro-trainer.yml
permissions:
  contents: write
jobs:
  import-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original ICU trainer portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img/neurocoaching
          curl --fail --location --retry 2 --connect-timeout 12 --max-time 55 \
            "https://coachunion.co.ua/wp-content/uploads/2020/01/enrike-276x300.jpg" \
            --output img/neurocoaching/jose-enrique-jimenez-soler.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('img/neurocoaching/jose-enrique-jimenez-soler.jpg')
          data=p.read_bytes()
          assert data.startswith(b'\xff\xd8\xff'), 'Portrait is not JPEG'
          assert 3000 <= len(data) <= 2500000, 'Unexpected portrait size'
          print('Original ICU portrait preserved:',len(data),'bytes')
          PY
      - name: Commit portrait into working branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/neurocoaching/jose-enrique-jimenez-soler.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Keep original ICU neurocoaching trainer portrait in repository"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
