name: Import original ICU review scans
on:
  push:
    branches:
      - improve/enrollment-experience-nov-2026
    paths:
      - .github/workflows/import-reviews.yml
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download 25 archived review scans and thumbnails
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          import re, time

          raw=Path('otziw.html').read_text(encoding='utf-8')
          matches=re.findall(r'image:\s*"(https?://[^"]+)"\s*,\s*fullImage:\s*"(https?://[^"]+)"', raw)
          if len(matches)!=25:
              raise SystemExit('Expected 25 published review records; got '+str(len(matches)))
          urls={u for pair in matches for u in pair}
          Path('img/reviews').mkdir(parents=True,exist_ok=True)
          def retrieve(url):
              parts=urlsplit(url)
              assert parts.path.startswith('/wp-content/uploads/2014/05/')
              filename=Path(parts.path).name
              assert re.fullmatch(r'[a-zA-Z0-9_.-]+',filename)
              assert filename.lower().endswith(('.jpg','.jpeg','.png'))
              attempts=[
                'https://coachunionlv.com'+parts.path,
                'https://coachunion.lv'+parts.path,
              ]
              errors=[]
              for origin in attempts:
                  try:
                      req=Request(origin,headers={'User-Agent':'Mozilla/5.0 ICU public review archive migration'})
                      with urlopen(req,timeout=25) as response:
                          content=response.read(7000001)
                          content_type=response.headers.get('content-type','')
                      if len(content)<100 or len(content)>7000000:
                          raise ValueError('Unexpected file size '+str(len(content)))
                      if not (content.startswith(b'\xff\xd8\xff') or content.startswith(b'\x89PNG\r\n\x1a\n')):
                          raise ValueError('Not JPEG/PNG: '+content_type)
                      Path('img/reviews',filename).write_bytes(content)
                      return (filename,len(content),origin)
                  except Exception as error:
                      errors.append(str(error))
              raise RuntimeError(filename+': '+(' | '.join(errors)))
          failures=[]
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures={pool.submit(retrieve,url):url for url in urls}
              for future in as_completed(futures):
                  try:
                      name,n,source=future.result()
                      print('Saved',name,n,'bytes from',source,flush=True)
                  except Exception as exc:
                      failures.append(str(exc))
                      print('FAILED',exc,flush=True)
          if failures:
              raise SystemExit('Missing '+str(len(failures))+' of '+str(len(urls))+' referenced images; do not commit partial archive.')
          print('All',len(urls),'review scans and thumbnails verified')
          PY
      - name: Commit locally hosted review archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/reviews
          if git diff --cached --quiet; then
            echo "Archive already present"
          else
            git commit -m "Archive 25 original ICU documentary reviews as local image files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
